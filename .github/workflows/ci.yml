name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^_wip/'))" || (gofmt -l $(git ls-files '*.go' | grep -v '^_wip/') && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -tags webkit2_41 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vitest run
      - run: npm run build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: npm ci
        working-directory: frontend
      - run: buf lint && buf generate
      - name: generated code is up to date
        run: git diff --exit-code -- gen frontend/src/lib/gen

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: quarry
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      QUARRY_TEST_PG_DSN: postgres://postgres:quarry@localhost:55432/postgres?sslmode=disable
      QUARRY_TEST_REDIS_DSN: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/driver/... ./service/...

  oracle:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: quarry
        ports: ["51521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      QUARRY_TEST_ORA_DSN: oracle://system:quarry@localhost:51521/FREEPDB1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/driver/oracle/
