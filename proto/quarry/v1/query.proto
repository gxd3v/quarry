syntax = "proto3";

package quarry.v1;

import "quarry/v1/common.proto";
import "quarry/v1/explorer.proto";

option go_package = "github.com/gxd3v/quarry/gen/quarry/v1;quarryv1";

// QueryService runs scripts in editor tabs. Every tab is bound to one
// connection and scope and owns a dedicated session, opened lazily.
//
// Offsets and positions are UTF-16 code units into the script, as the editor
// counts them.
service QueryService {
  rpc OpenTab(OpenTabRequest) returns (OpenTabResponse);
  // Rebind moves a tab to another connection or scope, closing its session.
  rpc Rebind(RebindRequest) returns (RebindResponse);
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  // Analyze splits a script into statements and finds the one at the cursor.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
  // Inspect reports what a Run with the same arguments would execute: the
  // risk of each statement and the bind parameters that need values.
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // Run executes statements; closing the stream cancels the run. The last
  // result stays open when it has more rows, to be continued with Fetch.
  rpc Run(RunRequest) returns (stream RunEvent);
  rpc Fetch(FetchRequest) returns (stream RunEvent);
  // Cancel stops the tab's running Run or Fetch without closing its stream.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc SetAutoCommit(SetAutoCommitRequest) returns (SetAutoCommitResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  // Complete suggests completions at the cursor. It never waits for a
  // running statement of the tab.
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  // Explain shows the execution plan of one statement. Like Run it holds the
  // tab busy and Cancel stops it. With analyze the statement is executed and
  // then rolled back, so it passes the same guards as Run.
  rpc Explain(ExplainRequest) returns (ExplainResponse);
}

message TxState {
  // False when the session does not support transactions.
  bool supported = 1;
  bool auto_commit = 2;
  bool in_tx = 3;
}

message OpenTabRequest {
  string conn_id = 1;
  Scope scope = 2;
}

message OpenTabResponse {
  string tab_id = 1;
  // sql | mongo | redis
  string language = 2;
}

message RebindRequest {
  string tab_id = 1;
  string conn_id = 2;
  Scope scope = 3;
}

message RebindResponse {
  string language = 1;
}

message CloseTabRequest {
  string tab_id = 1;
}

message CloseTabResponse {}

message StatementRange {
  int32 start = 1;
  int32 end = 2;
}

message AnalyzeRequest {
  string tab_id = 1;
  string script = 2;
  int32 cursor = 3;
}

message AnalyzeResponse {
  repeated StatementRange statements = 1;
  // Index into statements of the one at the cursor, -1 when there is none.
  int32 current = 2;
}

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  // The statement at start.
  RUN_MODE_STATEMENT = 1;
  // Every statement within [start, end).
  RUN_MODE_RANGE = 2;
}

message RunRequest {
  string tab_id = 1;
  string script = 2;
  RunMode mode = 3;
  int32 start = 4;
  int32 end = 5;
  // Rows streamed per result before pausing; 0 means the default.
  int32 max_rows = 6;
  // Values for bind parameters (:name, $1), substituted as literals.
  map<string, string> params = 7;
  // The user confirmed the risks reported by Inspect. Without it, a run that
  // needs confirmation fails with FAILED_PRECONDITION before executing.
  bool confirmed = 8;
}

message InspectRequest {
  string tab_id = 1;
  string script = 2;
  RunMode mode = 3;
  int32 start = 4;
  int32 end = 5;
}

message StatementCheck {
  StatementRange range = 1;
  // none | write | ddl | unbounded_write | destructive
  string risk = 2;
  // e.g. "DELETE", "DROP TABLE".
  string verb = 3;
  string reason = 4;
}

message InspectResponse {
  repeated StatementCheck statements = 1;
  // Distinct parameter names in order of first use.
  repeated string params = 2;
  // A Run needs confirmed=true: writes on a prod connection, or unbounded
  // writes and destructive statements anywhere.
  bool needs_confirmation = 3;
  // The connection is read-only and some statement writes; the Run will fail.
  bool blocked = 4;
  string env = 5;
}

message FetchRequest {
  string tab_id = 1;
  // 0 means the default page; negative fetches everything that is left.
  int32 max_rows = 2;
}

message RunStarted {
  string run_id = 1;
  int32 statements = 2;
}

message StatementStarted {
  int32 index = 1;
  StatementRange range = 2;
}

message ResultColumns {
  repeated Column columns = 1;
}

message RowBatch {
  repeated Row rows = 1;
}

message StatementDone {
  // -1 when not applicable.
  int64 affected = 1;
  string tag = 2;
  int64 elapsed_ms = 3;
  // Rows streamed for this result so far, across Run and Fetch.
  int64 rows = 4;
  // The result has more rows; it stays open for Fetch.
  bool has_more = 5;
}

message QueryError {
  string message = 1;
  string code = 2;
  string detail = 3;
  string hint = 4;
  // Absolute offset into the script, -1 when unknown.
  int32 position = 5;
}

message ServerMessage {
  string severity = 1;
  string text = 2;
}

message RunFinished {
  int64 elapsed_ms = 1;
  TxState tx = 2;
  bool canceled = 3;
}

message RunEvent {
  oneof event {
    RunStarted started = 1;
    StatementStarted statement = 2;
    ResultColumns columns = 3;
    RowBatch rows = 4;
    StatementDone done = 5;
    QueryError error = 6;
    ServerMessage message = 7;
    RunFinished finished = 8;
  }
}

message CancelRequest {
  string tab_id = 1;
}

message CancelResponse {}

message SetAutoCommitRequest {
  string tab_id = 1;
  bool on = 2;
}

message SetAutoCommitResponse {
  TxState tx = 1;
}

message CommitRequest {
  string tab_id = 1;
}

message CommitResponse {
  TxState tx = 1;
}

message RollbackRequest {
  string tab_id = 1;
}

message RollbackResponse {
  TxState tx = 1;
}

message CompleteRequest {
  string tab_id = 1;
  string script = 2;
  int32 cursor = 3;
}

message CompletionItem {
  string label = 1;
  // Replaces the response's [start, end) range.
  string insert = 2;
  string detail = 3;
  // keyword | schema | table | view | column | function | alias | snippet |
  // collection | command | key
  string kind = 4;
}

message CompleteResponse {
  int32 start = 1;
  int32 end = 2;
  repeated CompletionItem items = 3;
}

message ExplainRequest {
  string tab_id = 1;
  string script = 2;
  // Selects the statement as Run does; RUN_MODE_RANGE must cover exactly one.
  RunMode mode = 3;
  int32 start = 4;
  int32 end = 5;
  map<string, string> params = 6;
  // Execute the statement to report actual times and rows (EXPLAIN ANALYZE).
  bool analyze = 7;
  // As in RunRequest; only checked with analyze.
  bool confirmed = 8;
}

// PlanNode is one operator of an execution plan.
message PlanNode {
  // e.g. "Seq Scan", "Hash Join", "HashAggregate".
  string op = 1;
  // Relation, index, CTE or function the operator reads, if any.
  string target = 2;
  // Planner total cost and row estimate.
  double cost = 3;
  double rows = 4;
  // Actual time in ms and rows over all loops; -1 without analyze.
  double actual = 5;
  double act_rows = 6;
  // Other details worth showing: filters, conditions, sort keys, buffers...
  map<string, string> props = 7;
  repeated PlanNode children = 8;
}

message ExplainResponse {
  // Unset when error is set.
  PlanNode plan = 1;
  // The server rejected the statement; positions refer to the script.
  QueryError error = 2;
  // The statement explained.
  StatementRange range = 3;
  repeated ServerMessage messages = 4;
  TxState tx = 5;
}
